services:
  # 前端应用
  narratoai-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建时环境变量
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
        VITE_R2_BASE_URL: ${VITE_R2_BASE_URL:-https://r2.narratoai.cn}
    container_name: narratoai-frontend
    image: narratoai-frontend:latest
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - narratoai-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "com.narratoai.service=frontend"
      - "com.narratoai.version=1.1.1"

networks:
  narratoai-network:
    driver: bridge
